<style>:root{--bg:#07080d;--fg:#eceef5;--mut:#8b90a3;--a:#7c9cff;--b:#b18cff;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.7 Sora,system-ui,sans-serif;overflow-x:hidden}
h1,h2,.brand,.btn{font-family:"Space Grotesk",Sora,sans-serif}
a{color:inherit;text-decoration:none}.muted{color:var(--mut)}
.wrap{max-width:1120px;margin:auto;padding:110px 24px 30px}
#progress{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--a),var(--b));transform:scaleX(0);transform-origin:left;z-index:99}
#glow{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(124,156,255,.13),transparent 65%);pointer-events:none;z-index:0;left:-210px;top:-210px}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(7,8,13,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.1rem}#links{display:flex;gap:26px}#links a{color:var(--mut);transition:color .2s}#links a:hover{color:var(--fg)}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer}
.burger span{display:block;height:2px;background:var(--fg);margin:6px 10px;transition:.25s}
.hero{min-height:100vh;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;position:relative}
.hero-text,.photo{position:relative;z-index:1}
.orb{position:absolute;right:4%;top:18%;width:min(480px,70vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--b),var(--a) 45%,transparent 70%);filter:blur(60px);opacity:.45}
.role{color:var(--a);font-weight:600}
h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.05;margin:8px 0 14px}
h1 span{display:inline-block}
#tagline{font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:500;color:#cfd3e4;max-width:30ch;margin-bottom:14px}
.lead{color:var(--mut);max-width:56ch}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 20px}
.btn{padding:13px 22px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-weight:500;display:inline-flex;align-items:center;transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--a)}
.btn.primary{background:linear-gradient(135deg,var(--a),var(--b));color:#0a0b12;border:0}
.social{display:flex;gap:12px}.social a{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);transition:.2s}.social a:hover{border-color:var(--a);transform:translateY(-2px)}
.social svg{width:20px;height:20px;fill:currentColor}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(10px)}
.pad{padding:30px}.pad p+p{margin-top:14px}
.photo{overflow:hidden;padding:0;aspect-ratio:1/1.05}.photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.title{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.cat{padding:22px}.cat h3{font-size:1rem;margin-bottom:12px;color:var(--a)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:.88rem}
.chip.learn{border-style:dashed;border-color:var(--b)}.chip small{color:var(--b);margin-left:6px}
.card{overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-6px);border-color:var(--a)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#1b2447,#3a2a66);display:grid;place-items:center;font:700 2.4rem "Space Grotesk";color:rgba(255,255,255,.55);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .thumb img{transform:scale(1.06)}
.card .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}.card h3{font-size:1.05rem;word-break:break-word}
.card p{color:var(--mut);font-size:.92rem;flex:1}.card .btns{margin:6px 0 0}.card .btn{padding:9px 16px;min-height:42px;font-size:.9rem}
.timeline{list-style:none;margin-top:30px;border-left:2px solid var(--line);padding-left:28px}
.timeline li{position:relative;padding:8px 0 22px;font-weight:500}
.timeline li::before{content:"";position:absolute;left:-37px;top:14px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--mut)}
.timeline li.done::before{background:var(--a);border-color:var(--a)}
.timeline li.current::before{border-color:var(--b);background:var(--b);box-shadow:0 0 0 6px rgba(177,140,255,.2)}
.timeline small{display:block;color:var(--mut);font-weight:400}
.timeline li.next{color:var(--mut)}
#edu{margin-top:50px}.edu{padding:24px}.edu h3{font-size:1.15rem}
.contact{text-align:center;padding-bottom:70px}.big{font-size:clamp(2rem,5vw,3.6rem);line-height:1.1;margin-bottom:14px}
.contact .lead{margin:auto}.contact .btns,.contact .social{justify-content:center}
footer{text-align:center;padding:30px 24px 40px;font-size:.85rem}
a:focus-visible,button:focus-visible{outline:2px solid var(--a);outline-offset:3px}
@media(max-width:820px){
 .hero{grid-template-columns:1fr;padding-top:100px}.photo{max-width:380px;order:-1}
 .burger{display:block}
 #links{position:fixed;inset:64px 0 auto 0;flex-direction:column;gap:0;background:rgba(7,8,13,.96);padding:8px 24px 20px;transform:translateY(-130%);transition:transform .3s;border-bottom:1px solid var(--line)}
 #links.open{transform:none}#links a{padding:14px 0;border-bottom:1px solid var(--line)}
 .wrap{padding-top:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

body{padding-top:env(safe-area-inset-top,0)}.nav{padding-top:calc(14px + env(safe-area-inset-top,0px))}</style>

<script>// Renders content from data.js and adds animations. You rarely need to edit this file.

const social = `<a href="${D.social.github}" target="_blank" rel="noopener" aria-label="GitHub">${ICON.github}</a><a href="${D.social.linkedin}" target="_blank" rel="noopener" aria-label="LinkedIn">${ICON.linkedin}</a>`;

}
